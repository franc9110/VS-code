<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Pediatría - Modular</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-xl w-full">
        
        <div id="inicio-container" class="text-center py-4">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Simulador de Pediatría</h1>
            <p class="text-gray-600 mb-8 font-medium">Seleccioná el examen que querés practicar</p>
            
            <div class="space-y-4 max-w-xs mx-auto mb-6">
                <button onclick="comenzarExamen('parcial1')" class="w-full bg-blue-50 border-2 border-blue-200 hover:border-blue-500 text-blue-700 font-bold py-4 px-4 rounded-xl transition-all block text-lg">
                    📗 Primer Parcial
                </button>
                
                <button onclick="comenzarExamen('parcial2')" class="w-full bg-blue-50 border-2 border-blue-200 hover:border-blue-500 text-blue-700 font-bold py-4 px-4 rounded-xl transition-all block text-lg">
                    📘 Segundo Parcial
                </button>
                
                <button onclick="comenzarExamen('efu')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-md transition-all block text-lg">
                    🎓 EFU (Examen Final)
                </button>
            </div>
        </div>

        <div id="quiz-pantalla" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-examen" class="text-xl font-bold text-gray-800 uppercase text-sm tracking-widest">Examen</h2>
                <span id="progreso" class="text-sm font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">1 de X</span>
            </div>

            <div id="quiz-container">
                <p id="pregunta-texto" class="text-lg font-medium text-gray-700 mb-4">Cargando pregunta...</p>
                <div id="opciones-container" class="space-y-3"></div>
                <button id="btn-siguiente" onclick="siguientePregunta()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg hidden transition-colors">
                    Siguiente Pregunta
                </button>
            </div>
        </div>

        <div id="resultado-container" class="hidden text-center py-6">
            <h2 class="text-3xl font-bold text-green-600 mb-2">¡Completado!</h2>
            <p id="puntaje-texto" class="text-xl text-gray-700 mb-6"></p>
            <button onclick="volverAlInicio()" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                Volver al Inicio
            </button>
        </div>
    </div>

    <script>
        // BANCO DE PREGUNTAS ORGANIZADO
        const banco = {
            parcial1: [
                { "pregunta": "Un niño de 15 meses concurre al vacunatorio para control de salud. Según el calendario nacional vigente desde 2026, ¿qué vacunas corresponde administrar a esta edad?", "opciones": ["Pentavalente, hepatitis A, varicela y meningococo", "Pentavalente, triple viral, neumococo y meningococo", "Pentavalente, triple viral, varicela y meningococo", "Triple viral, varicela, meningococo y hepatitis A"], "correcta": 3 },
                { "pregunta": "Un niño nacido en agosto de 2024 concurre al control de los 18 meses. Los padres preguntan cuándo recibirá la segunda dosis de triple viral. Según el calendario vigente desde 2026, ¿cuál es la respuesta correcta?", "opciones": ["A los 5 años", "A los 36 meses", "En ese momento, luego del control", "Dentro de 6 meses"], "correcta": 2 },
                { "pregunta": "Una adolescente de 11 años acude al centro de salud para completar su esquema de vacunación. ¿Qué vacunas corresponde administrar a esta edad según el calendario nacional vigente?", "opciones": ["HPV (dos dosis), meningococo y triple bacteriana celular", "HPV (dosis única), neumococo y triple bacteriana acelular", "HPV (dosis única), meningococo y triple bacteriana acelular", "HPV (dosis única), meningococo y doble bacteriana"], "correcta": 2 },
                { "pregunta": "Un niño de 7 años y 2 meses consulta para completar esquema de vacunación. Requiere refuerzo contra difteria, tétanos y pertusis. ¿Qué vacuna debe administrarse?", "opciones": ["Triple bacteriana celular", "Doble bacteriana", "Triple bacteriana acelular", "Pentavalente"], "correcta": 2 },
                { "pregunta": "Un lactante de 18 meses es traído a consulta porque los padres notan que no pueden retraer completamente el prepucio. El niño no presenta síntomas. ¿Cuál es la conducta correcta?", "opciones": ["Cirugía programada", "Ejercicios de retracción forzada del prepucio", "Crema con corticoides por 4 semanas", "Observación"], "correcta": 3 },
                { "pregunta": "Un adolescente de 14 años consulta en la guardia por dolor testicular intenso de 2 horas de evolución, de inicio súbito. Al examen físico se constata ausencia de reflejo cremasteriano y testículo elevado. ¿Cuál es la conducta correcta?", "opciones": ["Solicitar derivación para ecodoppler y según resultado definir conducta", "Tratamiento antibiótico y analgesia", "Reposo y control en 24 horas", "Cirugía urgente"], "correcta": 3 },
                { "pregunta": "Un niño de 4 años es traído a la guardia por cojera y dolor en cadera de 3 días de evolución. Los padres refieren que tuvo un resfrío hace 2 semanas. El paciente está afebril y en buen estado general. ¿Cuál es el diagnóstico más probable?", "opciones": ["Artritis séptica", "Enfermedad de Perthes", "Epifisiolisis", "Sinovitis transitoria de cadera"], "correcta": 3 },
                { "pregunta": "Un lactante de 3 semanas de vida, varón, es traído a la guardia por vómitos proyectivos inmediatamente después de cada toma, sin contenido bilioso. Al examen físico se observa deshidratado. ¿Cuál es el diagnóstico más probable?", "opciones": ["Estenosis hipertrófica del píloro", "Reflujo gastroesofágico patológico", "Invaginación intestinal", "Gastroenteritis aguda"], "correcta": 0 },
                { "pregunta": "Un lactante de 9 meses es traído a la guardia por episodios de llanto intenso e inconsolable que alternan con períodos de calma, durante los cuales adopta posición con flexión de muslos sobre abdomen. ¿Cuál es el diagnóstico más probable?", "opciones": ["Estenosis hipertrófica del píloro", "Invaginación intestinal", "Reflujo gastroesofágico patológico", "Gastroenteritis aguda"], "correcta": 1 },
                { "pregunta": "Un niño de 6 años consulta por odinofagia, fiebre de 39°C, exudado faríngeo y adenomegalia cervical dolorosa. No presenta tos ni rinorrea. ¿Cuál es la conducta correcta?", "opciones": ["Diagnóstico clínico de faringitis viral, tratamiento sintomático", "Iniciar antibiótico empíricamente sin estudios", "Solicitar hemograma y proteína C reactiva", "Realizar hisopado de fauces"], "correcta": 3 },
                { "pregunta": "¿Cuál es el rango etario de mayor riesgo para desarrollar anemia ferropénica en pediatría?", "opciones": ["0 a 4 meses.", "6 a 24 meses.", "2 a 5 años.", "Adolescencia"], "correcta": 1 },
                { "pregunta": "¿Cuál es la dosis de hierro elemental recomendada para el tratamiento de anemia ferropénica en pediatría?", "opciones": ["1-2 mg/kg/día.", "3-6 mg/kg/día.", "7-10 mg/kg/día.", "0,5-1 mg/kg/día."], "correcta": 1 },
                { "pregunta": "¿Qué es el método BLW (Baby Led Weaning)?", "opciones": ["Un método donde se ofrecen alimentos en trozos para que el bebé los tome solo y se autoalimente", "Un método donde se ofrecen papillas licuadas", "Un método diseñado para bebés con problemas de deglución", "Un método que requiere supervisión médica especializada"], "correcta": 0 },
                { "pregunta": "¿Cuándo puede introducirse la leche de vaca entera en la alimentación del lactante?", "opciones": ["No antes del año de vida", "A los 6 meses junto con la alimentación complementaria", "A los 4 meses si tolera bien", "Solo después de los 2 años"], "correcta": 0 },
                { "pregunta": "¿Por qué se restringe el consumo de hojas verdes (acelga, espinaca) en menores de 1 año?", "opciones": ["Por riesgo de metahemoglobinemia debido a nitratos", "Por alto contenido de fibra indigerible", "Por riesgo de allergy alimentaria", "Por bajo valor nutricional"], "correcta": 0 },
                { "pregunta": "¿Cómo se describe característicamente la piel en la escarlatina al tacto?", "opciones": ["Piel lisa y brillante", "Piel húmeda y pegajosa", "Piel áspera o \"piel de lija\"", "Piel fría y marmórea"], "correcta": 2 },
                { "pregunta": "¿Cuál es el antibiótico de primera elección para el tratamiento ambulatorio de neumonía en niños sanos?", "opciones": ["Amoxicilina + Ac clavulánico", "Azitromicina", "Amoxicilina", "Clindamicina"], "correcta": 2 },
                { "pregunta": "Un lactante de 8 meses presenta eritema en la región del pañal que afecta las superficies convexas (zona de contacto con el pañal), respetando los pliegues inguinales. ¿Cuál es el diagnóstico más probable y el tratamiento indicado?", "opciones": ["Dermatitis irritativa del pañal; crema con óxido de zinc y recambios frecuentes", "Candidiasis del pañal; nistatina tópica", "Dermatitis seborreica; corticoides tópicos de baja potencia", "Psoriasis del pañal; corticoide tópico"], "correcta": 0 },
                { "pregunta": "Un niño de 6 años es traído a urgencias con fiebre de 40°C, dificultad respiratoria progresiva que empeora con el llanto, babeo abundante y aspecto tóxico. Se encuentra en posición de trípode con hiperextensión del cuello. ¿Cuál es el diagnóstico más probable?", "opciones": ["Laringitis subglótica", "Absceso periamigdalino", "Epiglotitis", "Cuerpo extraño en vía aérea"], "correcta": 2 },
                { "pregunta": "Pablo de 7 años tiene una talla con Z-score de -2,3. El rango genético calculado a partir de la talla de ambos padres arroja un Z-score entre -2,5 y +1. ¿Cómo se interpreta esta situación?", "opciones": ["Baja talla para la población, talla normal para su familia", "Talla normal para la población y para su familia", "Baja talla para la población y para su familia", "Talla normal para la población, baja talla para su familia"], "correcta": 0 },
                { "pregunta": "En una guardería se diagnostica meningitis por Haemophilus influenzae tipo B en un niño de 2 años. Un compañero de sala de 3 años tiene vacunación incompleta para Hib. ¿Cuál es la conducta respecto a la quimioprofilaxis del contacto?", "opciones": ["No requiere profilaxis porque es mayor de 2 años", "Indicar profilaxis con amoxicilina por 7 días", "Indicar rifampicina 20 mg/kg/día cada 24 horas por 4 días", "Indicar rifampicina 20 mg/kg/día cada 12 horas por 2 días"], "correcta": 2 },
                { "pregunta": "Un recién nacido a término de 3 días de vida no ha eliminado meconio desde el nacimiento. Presenta distensión abdominal progresiva. Al tacto rectal se evidencia recto vacío con posterior defecación explosiva. ¿Cuál es el diagnóstico más probable?", "opciones": ["Íleo meconial", "Atresia duodenal", "Estreñimiento funcional", "Enfermedad de Hirschsprung"], "correcta": 3 },
                { "pregunta": "Un lactante de 6 semanas presenta vómitos postprandiales escasos, no proyectivos, luego de la toma del pecho. Crece adecuadamente en percentilo 50-75 y no presenta deshidratación. ¿Cuál es el diagnóstico más probable?", "opciones": ["Estenosis hipertrófica del píloro", "Reflujo gastroesofágico fisiológico", "Alergia a la proteína de leche de vaca", "Sobrealimentación"], "correcta": 1 },
                { "pregunta": "Un lactante de 11 meses presenta diarrea con sangre, palidez marcada y oligoanuria de 12 horas de evolución. El hemograma muestra anemia con esquistocitos y plaquetopenia. ¿Cuál es el diagnóstico más probable?", "opciones": ["Invaginación intestinal", "Púrpura trombocitopénica inmune", "Apendicitis aguda", "Síndrome urémico hemolítico"], "correcta": 3 },
                { "pregunta": "Un niño de 18 meses presenta vesículas dolorosas en lengua y paladar, junto con lesiones maculopapulosas y vesiculosas en dedos de manos, pies y zona del pañal. Está subfebril. ¿Cuál es el agente etiológico más probable?", "opciones": ["Herpes simple tipo 1", "Coxsackie A", "Varicela-Zóster", "Herpes virus tipo 6"], "correcta": 1 },
                { "pregunta": "Un lactante de 8 meses con diagnóstico de bronquiolitis presenta frecuencia respiratoria de 64 por minuto y dificultad para alimentarse al pecho. ¿Cuál es la conducta más apropiada respecto a la alimentación?", "opciones": ["Continuar lactancia materna a libre demanda", "Suspender aporte oral e iniciar hidratación endovenosa", "Suspender lactancia y aporte oral y colocar sonda nasogástrica con leche materna extraída", "Indicar alimentación fraccionada con biberón"], "correcta": 2 },
                { "pregunta": "Consulta la madre de un niño de 14 meses que refiere que el niño toma aproximadamente un litro y medio de leche de vaca entera por día. ¿Cuál es el principal riesgo asociado a esta conducta?", "opciones": ["Diarrea osmótica por intolerancia a la lactosa", "Alergia a la proteína de leche de vaca", "Déficit de vitamina D por exceso de calcio", "Anemia ferropénica por microhemorragias intestinales y desplazamiento de otros"], "correcta": 3 },
                { "pregunta": "¿Cuál es el agente bacteriano más frecuente en neumonía adquirida en la comunidad en menores de 5 años sin factores de riesgo?","opciones":["Staphylococcus aureus.","Streptococcus pneumoniae.","Haemophilus influenzae tipo b.","Mycoplasma pneumoniae."],"correcta":1},
                { "pregunta": "¿Cuáles son los principales factores de riesgo para recurrencia de convulsiones febriles?","opciones":["Temperatura alta, duración prolongada, sexo masculino","Edad temprana, aparición al inicio del episodio febril, antecedentes familiares","Convulsión compleja, infección respiratoria, prematuridad","Desarrollo neurológico alterado, infección urinaria, fiebre prolongada"],"correcta":1},
                { "pregunta": "Paciente femenina de 9 años de edad es traída a consulta por su madre debido a dolor de cabeza persistente. La madre informa que la niña ha estado sufriendo de cefaleas frontales pulsátiles intermitentes durante las últimas dos semanas. La paciente indica que el dolor aumenta cuando se inclina hacia adelante y describe también congestión nasal y una disminución en su percepción del olfato. No hay historial de fiebre, vómitos, cambios en la visión o comportamiento, ni episodios previos similares. La madre también menciona que la niña ha tenido episodios de rinitis. Dentro de las posibles etiologías de cefalea en esta paciente, ¿cuál es la más consistente con la presentación clínica descrita?","opciones":["Migraña","Cefalea tensional","Cefalea en racimos","Sinusitis"],"correcta":3}

        
            ],
            parcial2: [
                { "pregunta": "Niño de 5 años con fiebre alta, odinofagia, sin tos ni congestión nasal. Ganglios dolorosos. ¿Diagnóstico?", "opciones": ["Viral", "Mononucleosis", "Estreptocócica", "Laringitis"], "correcta": 2 },
                { "pregunta": "Niño de 4 años con rinorrea purulenta, cefalea frontal y tos nocturna. ¿Diagnóstico?", "opciones": ["Viral", "Sinusitis", "Bronquiolitis", "Cuerpo extraño"], "correcta": 1 },
                { "pregunta": "Niño de 7 años con hematuria, oliguria, edema y HTA. ¿Estudio más útil?", "opciones": ["Proteinograma", "Dosaje complemento", "Rx abdomen", "Ionograma"], "correcta": 1 },
                { "pregunta": "Adolescente con dolor escrotal brusco post fútbol. Reflejo cremastérico ausente. ¿Sospecha?", "opciones": ["Hidrocele", "Epididimitis", "Torsión testicular", "Varicocele"], "correcta": 2 },
                { "pregunta": "Niño con petequias, mal estado general, leucocitosis y plaquetopenia. ¿Diagnóstico?", "opciones": ["Leucemia", "Púrpura", "Meningococcemia", "Kawasaki"], "correcta": 2 },
                { "pregunta": "Adolescente con fiebre, escroto doloroso, piuria y actividad sexual reciente. ¿Diagnóstico?", "opciones": ["Torsión", "Epididimitis", "Orquitis viral", "Varicocele"], "correcta": 1 },
                { "pregunta": "Niño con cetoacidosis diabética. ¿Medida inicial?", "opciones": ["Bolo insulina", "Expansión SF", "Potasio", "Ayuno"], "correcta": 1 },
                { "pregunta": "Niño de 11 meses con fiebre de 72 horas, catarro nasal y exantema maculopapular confluente. ¿Diagnóstico?", "opciones": ["Rubéola", "Sarampión", "Eritema infeccioso", "Escarlatina"], "correcta": 1 },
                { "pregunta": "Niño de 9 meses, fiebre de 3 días que cede bruscamente y aparece exantema. ¿Diagnóstico?", "opciones": ["Escarlatina", "Eritema infeccioso", "Sexta enfermedad", "Sarampión"], "correcta": 2 },
                { "pregunta": "Adolescente de 14 años con talla -2DE, EO de 12 años. Sin fenotipos anormales. ¿Diagnóstico?", "opciones": ["S. Turner", "Retraso constitucional", "Hipotiroidismo", "Baja talla familiar"], "correcta": 1 },
                { "pregunta": "Lactante con estancamiento ponderal, hilio meconial y 3 bronquiolitis. ¿Sospecha?", "opciones": ["Asma", "DBP", "Fibrosis quística", "Inmunodeficiencia"], "correcta": 2 },
                { "pregunta": "Lactante de 18 meses con fimosis. ¿Conducta?", "opciones": ["Circuncisión", "Corticoides", "Fisiológica - Nada", "Cirugía"], "correcta": 2 },
                { "pregunta": "Niño de 12 meses, testículo en canal inguinal, fácilmente descendible. ¿Conducta?", "opciones": ["Cirugía", "Testículo retráctil - Control", "Hernia", "Hidrocele"], "correcta": 1 },
                { "pregunta": "Niña de 14 años con talla baja, cuello corto y pterigium colli. ¿Primer estudio?", "opciones": ["Hormonas", "Rx mano + Cariotipo", "Eco tiroides", "Eco renal"], "correcta": 1 },
                { "pregunta": "Niño de 2 años con convulsión febril típica. Primera vez. ¿Conducta?", "opciones": ["Punción lumbar", "Profilaxis", "Observación", "Anticonvulsivante"], "correcta": 2 },
                { "pregunta": "Niño de 11 meses con fiebre de 72 horas, catarro nasal y exantema maculopapular confluente. ¿Diagnóstico?", "opciones": ["Rubéola", "Sarampión", "Eritema infeccioso", "Escarlatina"], "correcta": 1 },
                

            ]
        };

        let preguntas = [];
        let indiceActual = 0;
        let puntaje = 0;
        let respondido = false;

        function comenzarExamen(tipo) {
            // Lógica para EFU: Combinar parcial 1 y 2
            if(tipo === 'efu') {
                preguntas = [...banco.parcial1, ...banco.parcial2];
                document.getElementById('titulo-examen').innerText = "Examen Final Único";
            } else {
                preguntas = [...banco[tipo]];
                document.getElementById('titulo-examen').innerText = (tipo === 'parcial1') ? "Primer Parcial" : "Segundo Parcial";
            }

            // Mezclar preguntas
            preguntas.sort(() => 0.5 - Math.random());
            
            indiceActual = 0;
            puntaje = 0;
            document.getElementById('inicio-container').classList.add('hidden');
            document.getElementById('quiz-pantalla').classList.remove('hidden');
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            document.getElementById('btn-siguiente').classList.add('hidden');
            const info = preguntas[indiceActual];
            document.getElementById('progreso').innerText = `${indiceActual + 1} de ${preguntas.length}`;
            document.getElementById('pregunta-texto').innerText = info.pregunta;

            const opcionesDiv = document.getElementById('opciones-container');
            opcionesDiv.innerHTML = '';

            info.opciones.forEach((opcion, index) => {
                const btn = document.createElement('button');
                btn.innerText = opcion;
                btn.className = "w-full text-left p-3 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors font-medium text-gray-700";
                btn.onclick = () => verificarRespuesta(index, btn);
                opcionesDiv.appendChild(btn);
            });
        }

        function verificarRespuesta(seleccionado, btn) {
            if (respondido) return;
            respondido = true;
            const correcta = preguntas[indiceActual].correcta;
            const botones = document.getElementById('opciones-container').children;

            if (seleccionado === correcta) {
                btn.className = "w-full text-left p-3 rounded-lg bg-green-100 border border-green-500 text-green-700 font-bold";
                puntaje++;
            } else {
                btn.className = "w-full text-left p-3 rounded-lg bg-red-100 border border-red-500 text-red-700 font-bold";
                botones[correcta].className = "w-full text-left p-3 rounded-lg bg-green-100 border border-green-500 text-green-700 font-bold";
            }

            for (let b of botones) b.disabled = true;
            document.getElementById('btn-siguiente').classList.remove('hidden');
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < preguntas.length) cargarPregunta();
            else mostrarResultados();
        }

        function mostrarResultados() {
            document.getElementById('quiz-pantalla').classList.add('hidden');
            document.getElementById('resultado-container').classList.remove('hidden');
            document.getElementById('puntaje-texto').innerText = `Puntaje final: ${puntaje} de ${preguntas.length}`;
        }

        function volverAlInicio() {
            document.getElementById('resultado-container').classList.add('hidden');
            document.getElementById('inicio-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
