<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Exámenes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-xl w-full">
        
        <div id="inicio-container" class="text-center py-4">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Simulador de Pediatría</h1>
            <p class="text-gray-600 mb-8 font-medium">Prepará tus choices con este banco de preguntas clave.</p>
            
            <div class="space-y-4 max-w-xs mx-auto mb-6">
                <span class="block text-sm font-semibold text-gray-500 uppercase tracking-wider">Selecciona la modalidad</span>
                
                <button onclick="comenzarExamen(10)" class="w-full bg-blue-50 border-2 border-blue-200 hover:border-blue-500 text-blue-700 font-semibold py-3 px-4 rounded-xl transition-all block">
                    ⏱️ Modo Rápido (10 preguntas)
                </button>
                
                <button onclick="comenzarExamen(30)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all block">
                    🔥 Examen Completo (30 preguntas)
                </button>
            </div>
        </div>

        <div id="quiz-pantalla" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Simulador de Choices</h2>
                <span id="progreso" class="text-sm font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Pregunta 1 de X</span>
            </div>

            <div id="quiz-container">
                <p id="pregunta-texto" class="text-lg font-medium text-gray-700 mb-4">Cargando pregunta...</p>
                
                <div id="opciones-container" class="space-y-3"></div>

                <button id="btn-siguiente" onclick="siguientePregunta()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg hidden transition-colors">
                    Siguiente Pregunta
                </button>
            </div>
        </div>

        <div id="resultado-container" class="hidden text-center py-6">
            <h2 class="text-3xl font-bold text-green-600 mb-2">¡Examen Terminado!</h2>
            <p id="puntaje-texto" class="text-xl text-gray-700 mb-6"></p>
            <button onclick="volverAlInicio()" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                Ir al Inicio
            </button>
        </div>
    </div>

    <script>
        // Banco completo de preguntas fijas
        const bancoPreguntas = [
          { "pregunta": "Niño de 11 meses con fiebre de 72 horas, catarro nasal y exantema maculopapular confluente. ¿Diagnóstico más probable?", "opciones": ["Rubéola", "Sarampión", "Eritema infeccioso", "Escarlatina"], "correcta": 1 },
          { "pregunta": "Niño de 9 meses, previamente sano, presenta fiebre de 3 días que cede bruscamente y luego aparece exantema. ¿Diagnóstico?", "opciones": ["Escarlatina", "Eritema infeccioso", "Sexta enfermedad", "Sarampión"], "correcta": 2 },
          { "pregunta": "Niño de 5 años con fiebre alta, odinofagia, sin tos ni congestión nasal. Ganglios dolorosos al examen físico. ¿Diagnóstico más probable?", "opciones": ["Faringitis viral", "Mononucleosis", "Faringitis estreptocócica", "Laringitis"], "correcta": 2 },
          { "pregunta": "Niño de 4 años con rinorrea purulenta bilateral, cefalea frontal, tos nocturna que empeora al acostarse. ¿Diagnóstico más probable?", "opciones": ["Faringitis viral", "Sinusitis", "Bronquiolitis", "Cuerpo extraño nasal"], "correcta": 1 },
          { "pregunta": "Adolescente de 14 años con talla -2DE, sin antecedentes perinatales ni fenotipos anormales. Edad ósea de 12 años. ¿Diagnóstico más probable?", "opciones": ["Síndrome de Turner", "Retraso constitucional del crecimiento", "Hipotiroidismo", "Baja talla familiar"], "correcta": 1 },
          { "pregunta": "Lactante con peso y talla normales al nacer. Estancamiento ponderal, hilio meconial, 3 episodios de bronquiolitis. ¿Sospecha inicial?", "opciones": ["Asma", "Displasia broncopulmonar", "Fibrosis quística", "Déficit inmunológico"], "correcta": 2 },
          { "pregunta": "Niño de 7 años con hematuria, oliguria, edema bipalpebral y HTA. ¿Estudio más útil para orientar el diagnóstico?", "opciones": ["Proteinograma", "Dosaje de complemento", "Rx de abdomen", "Ionograma"], "correcta": 1 },
          { "pregunta": "Niño de 2 años con convulsión tonicoclónica de 2 minutos, fiebre 38°C. Primera vez que ocurre. ¿Conducta adecuada?", "opciones": ["Punción lumbar urgente", "Diazepam profiláctico", "Tratamiento expectante", "Internación prolongada"], "correcta": 2 },
          { "pregunta": "Adolescente con dolor escrotal brusco tras jugar fútbol. Reflejo cremastérico ausente. ¿Sospecha diagnóstica?", "opciones": ["Hidrocele", "Epididimitis", "Torsión testicular", "Varicocele"], "correcta": 2 },
          { "pregunta": "Niño con petequias generalizadas, leucocitosis y plaquetopenia. ¿Diagnóstico más probable?", "opciones": ["Leucemia", "Púrpura trombocitopénica", "Meningococcemia", "Kawasaki"], "correcta": 2 },
          { "pregunta": "Adolescente de 13 años, sin menstruación, talla en PC10, mamas y vello en estadio 2, EO 11,5 años. ¿Conducta?", "opciones": ["Derivar a endocrinología", "Iniciar terapia hormonal", "Solicitar cariotipo", "Tranquilizar y controlar evolución"], "correcta": 3 },
          { "pregunta": "Lactante con peso y talla al nacer en PC50, estancamiento ponderal, hilio meconial, 3 bronquiolitis. ¿Conducta inicial?", "opciones": ["Test del sudor", "Radiografía de tórax", "Ecografía abdominal", "Estudio inmunológico"], "correcta": 0 },
          { "pregunta": "Niño de 18 meses con membrana timpánica abombada y contenido blanco visible. ¿Diagnóstico y tratamiento?", "opciones": ["OMA - Amoxicilina", "OMA - Macrólidos", "Otitis serosa - Corticoides", "Miringitis bullosa - Antivirales"], "correcta": 0 },
          { "pregunta": "Adolescente con fiebre, escroto doloroso, piuria y actividad sexual reciente. ¿Diagnóstico?", "opciones": ["Torsión testicular", "Epididimitis", "Orquitis viral", "Varicocele"], "correcta": 1 },
          { "pregunta": "Lactante de 18 meses con fimosis. ¿Conducta adecuada?", "opciones": ["Circuncisión inmediata", "Corticoides tópicos", "No hacer nada, es fisiológica", "Derivar a cirugía"], "correcta": 2 },
          { "pregunta": "Niño de 7 años con irritabilidad, pérdida de peso, enuresis, apetito aumentado y sed intensa. ¿Diagnóstico más probable?", "opciones": ["Síndrome nefrótico", "Diabetes tipo 1", "Infección urinaria", "Hipotiroidismo"], "correcta": 1 },
          { "pregunta": "Niño con petequias, mal estado general, leucocitosis y plaquetopenia. ¿Conducta inicial?", "opciones": ["Alta ambulatoria", "Hemograma y control", "Punción lumbar urgente", "Ecografía hepatoesplénica"], "correcta": 2 },
          { "pregunta": "Niño de 12 meses, testículo en canal inguinal, fácilmente descendible. ¿Diagnóstico y conducta?", "opciones": ["Criptorquidia - cirugía", "Testículo retráctil - control", "Hernia - reducción", "Hidrocele - derivación"], "correcta": 1 },
          { "pregunta": "Niño de 4 años con tos metálica, estridor, rinorrea y tiraje. ¿Diagnóstico más probable?", "opciones": ["Epiglotitis", "Laringitis", "Bronquiolitis", "Faringitis estreptocócica"], "correcta": 1 },
          { "pregunta": "Niña de 14 años, menarca ya ocurrida, mide 150 cm, madre mide 160 cm. ¿Pronóstico de crecimiento?", "opciones": ["Superará los 165 cm", "Crecerá varios centímetros", "Crecimiento muy limitado", "No crecerá más"], "correcta": 2 },
          { "pregunta": "Niño de 5 años, fiebre de 3 días, odinofagia, sin tos ni congestión. Prefiere líquidos fríos. ¿Diagnóstico más probable?", "opciones": ["Faringitis viral", "Escarlatina", "Faringitis estreptocócica", "Herpangina"], "correcta": 2 },
          { "pregunta": "Niño de 7 años con hematuria, oliguria, edema palpebral, HTA. ¿Estudio más útil?", "opciones": ["Dosaje de complemento", "Proteinograma", "Ecografía renal", "Biopsia renal"], "correcta": 0 },
          { "pregunta": "Niño con edema periorbitario, orina espumosa y TA normal. ¿Diagnóstico más probable?", "opciones": ["Síndrome nefrítico", "Glomerulonefritis", "Síndrome nefrótico", "Hipotiroidismo"], "correcta": 2 },
          { "pregunta": "Niña con talla baja, cuello corto y pterigium colli. ¿Primer estudio?", "opciones": ["Hormonas sexuales", "Rx de mano izquierda + genética + cardio", "Eco tiroidea", "Eco renal"], "correcta": 1 },
          { "pregunta": "Niño de 2 años, convulsión febril típica. Primera vez. ¿Conducta?", "opciones": ["Punción lumbar", "Profilaxis", "Observación", "Anticonvulsivante"], "correcta": 2 },
          { "pregunta": "Niño de 4 años, tos seca, estridor, rinorrea, tiraje. ¿Diagnóstico y manejo?", "opciones": ["Epiglotitis - intubación", "Laringitis - corticoide VO", "Bronquiolitis - O2", "Faringitis - sintomático"], "correcta": 1 },
          { "pregunta": "Niña de 14 años con 150 cm de estatura y menarca pasada. ¿Expectativa de crecimiento?", "opciones": ["Superará 165 cm", "Crecerá bastante aún", "Crecimiento muy limitado", "No crecerá más"], "correcta": 2 },
          { "pregunta": "Niño tratado con hierro, hermano con celiaquía. ¿Estudio antes de iniciar dieta?", "opciones": ["Iniciar dieta sin TACC", "Biopsia intestinal", "Anticuerpos transglutaminasa", "Genética HLA"], "correcta": 2 },
          { "pregunta": "Niño con petequias, leucocitos elevados y plaquetas bajas. ¿Diagnóstico más probable?", "opciones": ["LLA", "Púrpura", "Meningococcemia", "Dengue hemorrágico"], "correcta": 2 },
          { "pregunta": "Niño con cetoacidosis diabética. ¿Medida terapéutica inicial?", "opciones": ["Bolo de insulina", "Expansión con SF", "Reposición de potasio", "Ayuno absoluto"], "correcta": 1 }
        ];

        let preguntas = [];
        let indiceActual = 0;
        let puntaje = 0;
        let respondido = false;

        function comenzarExamen(cantidad) {
            // Mezclar preguntas aleatoriamente
            const mezcla = [...bancoPreguntas].sort(() => 0.5 - Math.random());
            // Tomar la cantidad elegida
            preguntas = mezcla.slice(0, cantidad);
            
            indiceActual = 0;
            puntaje = 0;

            // Ocultar inicio y mostrar juego
            document.getElementById('inicio-container').classList.add('hidden');
            document.getElementById('quiz-pantalla').classList.remove('hidden');
            
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            document.getElementById('btn-siguiente').classList.add('hidden');
            
            const infoPregunta = preguntas[indiceActual];
            document.getElementById('progreso').innerText = `Pregunta ${indiceActual + 1} de ${preguntas.length}`;
            document.getElementById('pregunta-texto').innerText = infoPregunta.pregunta;

            const opcionesDiv = document.getElementById('opciones-container');
            opcionesDiv.innerHTML = '';

            infoPregunta.opciones.forEach((opcion, index) => {
                const boton = document.createElement('button');
                boton.innerText = opcion;
                boton.className = "w-full text-left p-3 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors font-medium text-gray-700";
                boton.onclick = () => verificarRespuesta(index, boton);
                opcionesDiv.appendChild(boton);
            });
        }

        function verificarRespuesta(indiceSeleccionado, botonSeleccionado) {
            if (respondido) return;
            respondido = true;

            const correcta = preguntas[indiceActual].correcta;
            const opcionesBotones = document.getElementById('opciones-container').children;

            if (indiceSeleccionado === correcta) {
                botonSeleccionado.className = "w-full text-left p-3 rounded-lg bg-green-100 border border-green-500 text-green-700 font-semibold";
                puntaje++;
            } else {
                botonSeleccionado.className = "w-full text-left p-3 rounded-lg bg-red-100 border border-red-500 text-red-700 font-semibold";
                opcionesBotones[correcta].className = "w-full text-left p-3 rounded-lg bg-green-100 border border-green-500 text-green-700 font-semibold";
            }

            for (let btn of opcionesBotones) {
                btn.disabled = true;
            }

            document.getElementById('btn-siguiente').classList.remove('hidden');
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < preguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            document.getElementById('quiz-pantalla').classList.add('hidden');
            document.getElementById('resultado-container').classList.remove('hidden');
            document.getElementById('puntaje-texto').innerText = `Acertaste ${puntaje} de ${preguntas.length} preguntas.`;
        }

        function volverAlInicio() {
            document.getElementById('resultado-container').classList.add('hidden');
            document.getElementById('inicio-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
